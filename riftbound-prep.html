<style>

.game { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); }
.game { display: grid; gap: 10px; }

.sbline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.mrow .details.row { display: flex; }

.pic { border: 0; background: none; padding: 0; cursor: pointer; line-height: 0; border-radius: 6px; flex: none; }
.pic:hover .cimg, .pic:focus-visible .cimg { box-shadow: 0 0 0 2px var(--accent); }

.pic.bfpic { margin-top: 6px; justify-self: start; }
.lineup { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); }

.mlineup { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }

.bfs { display: inline-flex; align-items: center; gap: 5px; }
.bfs .pic.bfpic { margin-top: 0; }
.pic.pick { cursor: pointer; position: relative; }
.pic.pick.pic-empty::after { content: '+'; position: absolute; inset: 0; display: grid; place-items: center; font-size: 22px; line-height: 1; color: var(--muted); }
.pic.pick.pic-empty:hover .cimg, .pic.pick.pic-empty:focus-visible .cimg { border-color: var(--accent); box-shadow: none; }
.pic.pick.pic-empty:hover::after, .pic.pick.pic-empty:focus-visible::after { color: var(--accent); }
.modal-card.wide { width: min(860px, 100%); }
.pk-bar { position: sticky; top: -18px; z-index: 1; margin: 0 -18px 4px; padding: 10px 18px; background: var(--panel); flex-wrap: nowrap; }
.pk-h { margin: 12px 0 6px; }
.pk-grid { display: grid; gap: 10px 8px; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); align-items: start; }
.pk-grid.bf { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
.pk { border: 1px solid transparent; background: none; border-radius: var(--r); padding: 4px; cursor: pointer; display: grid; gap: 4px; align-content: start; text-align: center; color: inherit; font: inherit; }

.sbitem { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.shots { display: flex; flex-wrap: wrap; gap: 8px; }
.shot { position: relative; }

.shot { display: grid; gap: 4px; justify-items: stretch; align-content: start; }

.games-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.replay-video { width: 100%; max-height: 360px; border-radius: 6px; background: #000; }

.crow.on .cn { font-weight: 700; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }

.stepper button:disabled { opacity: .35; cursor: default; }
.stepper span { width: 28px; text-align: center; font-family: var(--f-mono); font-weight: 600; }

/* decks */

.sections { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }

.issues { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }

.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--r); background: var(--warn-bg); color: var(--warn); font-weight: 600; font-size: 14px; }
.banner.install { background: var(--accent-soft); color: var(--ink); }
.empty { text-align: center; padding: 36px 16px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.empty h3 { color: var(--ink); font-size: 17px; }
.confirm { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 6px; font-weight: 600; font-size: 14px; z-index: 50; max-width: calc(100% - 32px); }
.copybox { display: grid; gap: 8px; margin-top: 10px; }
.copybox textarea { font-family: var(--f-mono); font-size: 12.5px; min-height: 160px; }

/* cards */
.cimg { display: inline-block; flex: none; border-radius: 6px; background-color: var(--panel-2); background-repeat: no-repeat; max-width: 100%; }
.cimg.blank { border: 1px dashed var(--line); }
.cimg.mini { border-radius: 3px; }
.cards-layout { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr) 380px; align-items: start; }
.deck-panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 108px); max-height: calc(100vh - 128px); overflow: auto; padding: 14px; display: grid; gap: 4px; align-content: start; }
.dp-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.dp-name { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
.dp-close { display: none; }
button.pill { border: 0; cursor: pointer; }
.dsec { display: grid; padding-block: 8px; border-bottom: 1px solid var(--line); }
.dsec:last-child { border-bottom: 0; }
.dsec-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.cnt { font-size: 12.5px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); }
.cnt.ok { background: var(--win-bg); color: var(--win); }
.cnt.over { background: var(--loss-bg); color: var(--loss); }
.drow.over { background: var(--loss-bg); border-radius: 5px; }
.drow.over .stepper span { color: var(--loss); }
.banchip { flex: none; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--loss); border: 1px solid var(--loss); border-radius: 4px; padding: 0 4px; }
.banflag { position: absolute; left: 0; right: 0; top: 42%; background: var(--loss); color: #fff; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; text-align: center; padding: 3px 0; pointer-events: none; }
.report { border-radius: 6px; padding: 10px 12px; margin-block: 8px; font-size: 13.5px; }
.report.ok { background: var(--win-bg); color: var(--win); }
.report.bad { background: var(--loss-bg); color: var(--loss); }
.report ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 3px; }
.dsub { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); padding: 6px 2px 2px; font-weight: 600; }
.drow { display: grid; grid-template-columns: minmax(0, 1fr) auto 28px; align-items: center; gap: 6px; padding: 2px 0; }
.dname { display: flex; align-items: center; gap: 7px; min-width: 0; border: 0; background: none; padding: 2px; text-align: left; cursor: pointer; border-radius: 4px; }
.dname:hover { background: var(--panel-2); }
.dname .e { width: 14px; text-align: center; font-size: 12px; color: var(--muted); flex: none; }
.dname .nm { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.dname .nm.unknown { color: var(--warn); }
.dname .cimg.mini { width: 26px; }
.arrow { width: 28px; height: 26px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 5px; cursor: pointer; font-weight: 700; color: var(--accent); padding: 0; }
.arrow:hover { border-color: var(--accent); }
.arrow-sp { width: 28px; }
.ddom { width: 9px; height: 9px; border-radius: 2px; transform: rotate(45deg); display: inline-block; }
.dhint { font-size: 13px; color: var(--muted); padding: 2px 0 4px; }
.stepper.sm button { width: 24px; height: 24px; }
.stepper.sm span { width: 22px; font-size: 13px; }
.cf-tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; min-height: 30px; }
.ftag { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--ink); border-radius: 999px; padding: 3px 6px 3px 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
.ftag:hover { background: var(--panel-2); }
.ftag-k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.ftag-x { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 13px; line-height: 1; }
.ms-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-block: 10px 14px; }
.ms-row > select { width: auto; flex: 0 1 auto; }
.ms { position: relative; }
.ms summary { list-style: none; cursor: pointer; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 30px 7px 11px; white-space: nowrap; position: relative; user-select: none; }
.ms summary::-webkit-details-marker { display: none; }
.ms summary::after { content: ""; position: absolute; right: 11px; top: 50%; width: 6px; height: 6px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: translateY(-70%) rotate(45deg); }
.ms[open] summary::after { transform: translateY(-30%) rotate(225deg); }
.ms summary.on { border-color: var(--accent); }
.ms-n { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 11.5px; font-weight: 700; font-family: var(--f-mono); margin-left: 4px; }
.ms-pop { position: absolute; z-index: 25; top: calc(100% + 4px); left: 0; min-width: 190px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 28px rgba(0,0,0,.18); padding: 6px; display: grid; gap: 1px; }
.ms-opt { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 5px; cursor: pointer; white-space: nowrap; font-size: 14px; }
.ms-opt:hover { background: var(--panel-2); }
.ms-opt input { accent-color: var(--accent); margin: 0; width: 16px; height: 16px; }
.ms-pop .btn.link { justify-self: start; margin-top: 2px; }
.build-bar { display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; }
.build-bar input { flex: 1; min-width: 200px; }
.deckbar { display: none; }
.acct { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 12px; font-weight: 600; font-size: 13px; cursor: pointer; max-width: 170px; white-space: nowrap; flex: none; }
.acct:hover { border-color: var(--accent); }
.acct-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cdot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.cdot.ok { background: var(--win); } .cdot.busy { background: var(--gold); } .cdot.bad { background: var(--loss); }
.cloud-form { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); align-items: end; max-width: 720px; }
.cloud-form .row { grid-column: 1 / -1; }
.cloud-msg { margin: 10px 0 0; padding: 8px 12px; border-radius: 6px; background: var(--panel-2); font-size: 14px; }
.cloud-msg.bad { background: var(--loss-bg); color: var(--loss); }
.hint-touch { display: none; }
@media (hover: none) { .hint-mouse { display: none; } .hint-touch { display: inline; } }
.modal { position: fixed; inset: 0; z-index: 60; background: rgba(8, 10, 14, .55); display: grid; place-items: center; padding: 16px; }
.modal-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; width: min(640px, 100%); max-height: calc(100% - 32px); overflow: auto; position: relative; }
.modal-x { position: absolute; top: 12px; right: 12px; }
.modal .cdetail { grid-template-columns: auto minmax(0, 1fr); align-items: start; }
.cwrap { position: relative; display: block; width: 100%; }
.cimg.fluid { display: block; width: 100%; height: auto; }
.badges { position: absolute; right: 4px; bottom: 6px; display: flex; gap: 3px; }
.bq { background: var(--accent); color: var(--accent-ink); border-radius: 4px; padding: 1px 6px; font-weight: 700; font-size: 12.5px; font-family: var(--f-mono); }
.bq.sb { background: var(--gold); color: var(--panel); }
.info { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgba(10, 12, 16, .7); color: #fff; font-weight: 700; font-family: var(--f-display); cursor: pointer; opacity: 0; }
.ccard:hover .info, .ccard:focus-within .info, .info:focus-visible { opacity: 1; }
.ccard.has .cname { color: var(--accent); }
.ccard:active .cimg { transform: scale(.97); }
.cgrid { display: grid; gap: 14px 10px; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); align-items: start; }
.ccard { border: 1px solid transparent; background: none; border-radius: var(--r); padding: 6px; cursor: pointer; display: grid; justify-items: center; gap: 5px; align-content: start; text-align: center; }
.ccard:hover { background: var(--panel-2); }
.ccard.sel { border-color: var(--accent); background: var(--accent-soft); }
.ccard .cname { font-size: 13px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.cdetail { display: grid; gap: 14px; }
.cdimg { display: flex; justify-content: center; }
.cdimg .cimg { box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.dstats { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
.curve { display: flex; align-items: flex-end; gap: 6px; height: 130px; }
.cbar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; min-width: 0; }
.cbar b { width: 100%; max-width: 30px; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 1px; }
.pie-wrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.pie { width: 128px; height: 128px; flex: none; }

.pie-key { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 14px; }
.pie-key li { display: grid; grid-template-columns: 10px minmax(48px, auto) 28px 38px; gap: 8px; align-items: center; }
.pie-key i { width: 10px; height: 10px; border-radius: 2px; }
.pie-key .num { text-align: right; }
/* one-page deck picture */
.dv { position: fixed; inset: 0; z-index: 55; background: var(--bg); display: flex; flex-direction: column; }
.dv-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
.dv-bar h2 { font-size: 18px; overflow-wrap: anywhere; }
.dv-scroll { flex: 1; overflow: auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }

.dv-grid { display: grid; gap: 28px 14px; grid-template-columns: repeat(6, minmax(0, 1fr)); }

.dv-card { position: relative; border: 0; background: none; padding: 0; cursor: pointer; display: block; color: inherit; }
.dv-img { display: block; position: relative; aspect-ratio: 200 / 279; border-radius: 8px; overflow: hidden; background: #1D222D; box-shadow: 0 4px 14px rgba(0, 0, 0, .35); }
.dv-img > .cimg.fluid { border-radius: 0; }
/* Battlefields are landscape cards; they stand upright here like the rest. */
.dv-img.bf > .cimg { position: absolute; width: 139.5%; max-width: none; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-90deg); }
.dv-img.dv-miss { color: #fff; font-size: 13px; font-weight: 600; padding: 10px; overflow-wrap: anywhere; text-align: left; line-height: 1.3; }
.dv-card:hover .dv-img, .dv-card:focus-visible .dv-img { outline: 3px solid #fff; outline-offset: 2px; }
.dv-q { position: absolute; left: 50%; bottom: -13px; transform: translateX(-50%); background: #171B24; color: #fff; border: 2px solid rgba(255, 255, 255, .85); border-radius: 8px; padding: 2px 10px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.dv-empty { color: #fff; margin: 0; }
@media (max-width: 860px) { .dv-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 520px) { .dv-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px 10px; } .dv-sheet { padding: 14px 12px 26px; gap: 26px; } .dv-q { font-size: 12px; padding: 1px 7px; } }
.crow .cimg.mini { width: 30px; }

/* opponents (identified by Legend) */
.opp-cell { display: flex; align-items: center; gap: 10px; min-width: 200px; }
.opp-cell .pic { width: 34px; }
.opp-cell .nm { font-weight: 700; overflow-wrap: break-word; min-width: 0; }
.opp-cell .ch { display: block; font-size: 12.5px; color: var(--muted); font-weight: 400; }
.opp-cell .nm .pill { display: flex; width: max-content; margin-top: 3px; font-weight: 600; }
.legacy { font-size: 12.5px; color: var(--warn); }
/* battlefield matrix: my battlefield (rows) against theirs (columns) */
#bf-panel { scroll-margin-top: 120px; }
.bfm-bar { display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.bfm-bar select { width: auto; max-width: 100%; }
.bfm th, .bfm td { text-align: center; }
.bfm th:first-child, .bfm td:first-child { text-align: left; }
.bfm thead th { white-space: normal; min-width: 88px; vertical-align: bottom; text-transform: none; letter-spacing: 0; font-size: 12.5px; color: var(--ink); }
.bfm thead th:first-child { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; }
.bfm td:first-child { font-weight: 600; min-width: 130px; }
.bfm th:first-child, .bfm td:first-child { position: sticky; left: 0; z-index: 1; background: var(--panel); box-shadow: 1px 0 0 var(--line); }
td.bfc { font-family: var(--f-mono); line-height: 1.25; padding: 7px 8px; }
td.bfc b { display: block; font-size: 14px; font-weight: 600; }
td.bfc span { font-size: 11.5px; color: var(--muted); }
td.bfc.hi { background: var(--win-bg); } td.bfc.hi b { color: var(--win); }
td.bfc.lo { background: var(--loss-bg); } td.bfc.lo b { color: var(--loss); }
td.bfc.none { color: var(--muted); opacity: .5; }
.bfm .tot { border-left: 2px solid var(--line); }
.bfm tr.tot td { border-top: 2px solid var(--line); }
/* feedback tab */
a.btn { display: inline-block; text-decoration: none; }
.give { display: grid; gap: 20px; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); align-items: start; }
.give .qr { width: 100%; height: auto; max-width: 260px; border-radius: var(--r); border: 1px solid var(--line); display: block; }
.give dl { margin: 0; display: grid; gap: 14px; }
.give .qr-box { margin: 0; max-width: 260px; display: grid; gap: 10px; }
.give figcaption { display: grid; gap: 4px; text-align: center; }
.give figcaption strong { font-size: 18px; }
.give figcaption span { font-size: 15px; }
.give dt { font-size: 15px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.give dd { margin: 0; }
.give .num-big { font-family: var(--f-mono); font-size: 18px; font-weight: 700; margin-right: 6px; }
@media (max-width: 640px) { .give { grid-template-columns: 1fr; justify-items: center; } .give dl { justify-self: stretch; } }
/* ad slot + footer */
.ad { margin: 0 0 20px; padding: 8px 12px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); display: grid; gap: 6px; min-width: 0; overflow: hidden; }
.ad-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.foot { display: flex; gap: 4px 14px; flex-wrap: wrap; justify-content: center; padding: 0 0 28px; font-size: 12.5px; color: var(--muted); text-align: center; }
.foot a { color: var(--accent); }

@media (max-width: 700px) {
  .top-row { flex-wrap: nowrap; gap: 10px; padding-block: 8px 4px; }
  .brand { gap: 8px; }
  .brand svg { width: 24px; height: 24px; }
  .brand h1 { font-size: 16px; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status span:last-child { display: none; }
  .status { position: absolute; left: 17px; top: -3px; }
  .status .dot { width: 9px; height: 9px; box-shadow: 0 0 0 2px var(--bg); }
  .brand { position: relative; }
  .deckpick .label { display: none; }
  .acct { padding: 4px 9px; max-width: 110px; }
  .deckpick select { max-width: 150px; padding-block: 5px; }
  .tab { padding: 6px 11px 8px; }
  main { padding-block: 14px 20px; gap: 14px; }

// --- Matchups
function viewMatchups() {
  const all = S.ui.statsScope === 'all';

  const a = aggregate(list), groups = [...byArch(list).values()];

      <td>${wrCell(pct(g.a.post))}</td>
      <td class="num">${fmtPct(pct(g.a.play))}</td>
      <td class="num">${fmtPct(pct(g.a.draw))}</td>
      <td><div class="row" style="flex-wrap:nowrap"><button class="btn sm" data-act="bf-show" data-key="${esc(g.key)}">Battlefields</button>${all ? '' : `<button class="btn sm" data-act="open-guide" data-legend="${esc(g.legend)}" data-champ="${esc(gc)}">${gs === 'done' ? 'Guide ✓' : gs === 'bad' ? 'Guide (unbalanced)' : 'Write guide'}</button>`}</div></td>

  return `

    </div>

      ${tile('Game win rate', pct(a.g), `${a.g.W}–${a.g.L} games`)}
      ${tile('Game 1 (pre-board)', pct(a.g1), `${a.g1.W}–${a.g1.L}`)}
      ${tile('Games 2–3 (post-board)', pct(a.post), `${a.post.W}–${a.post.L}`)}
      ${tile('Going first', pct(a.play), `${a.play.W}–${a.play.L}`)}

// Game win rate for each of my battlefields against each of theirs, for every matchup or one Legend.
const bfName = n => { const c = n && findCard(n); return c && c.t === 'Battlefield' ? c.n : String(n || '').trim(); };
function bfMatrixHTML(list, groups) {
  const sel = groups.find(g => g.key === S.ui.bfOpp) || groups.find(g => g.key === String(S.ui.bfOpp || '').split('|')[0]) || null;
  const cells = new Map(), mine = new Map(), theirs = new Map(), sum = { W: 0, L: 0 };
  let none = 0;
  const add = (map, k, r) => { const e = map.get(k) || { W: 0, L: 0 }; e[r]++; map.set(k, e); };
  (sel ? sel.list : list).forEach(m => (m.games || []).forEach(g => {
    if (g.r !== 'W' && g.r !== 'L') return;
    const a = bfName(g.myBf), b = bfName(g.oppBf);
    if (!a && !b) { none++; return; }
    sum[g.r]++; if (a) add(mine, a, g.r); if (b) add(theirs, b, g.r); if (a && b) add(cells, a + '\n' + b, g.r);
  }));
  const order = map => [...map.entries()].sort((x, y) => (y[1].W + y[1].L) - (x[1].W + x[1].L) || x[0].localeCompare(y[0])).map(e => e[0]);
  const rowsK = order(mine), colsK = order(theirs);
  const cell = (a, cls = '') => {
    const p = a ? pct(a) : null;
    return p == null ? `<td class="bfc none ${cls}">·</td>` : `<td class="bfc ${p >= 0.55 ? 'hi' : p <= 0.45 ? 'lo' : ''} ${cls}" title="${a.W} won, ${a.L} lost"><b>${fmtPct(p)}</b><span>${a.W}–${a.L}</span></td>`;
  };
  const picker = `<div class="bfm-bar"><label class="label" for="bf-opp">Matchup</label>
    <select id="bf-opp"><option value="">All opponents</option>${groups.map(g => `<option value="${esc(g.key)}"${sel && sel.key === g.key ? ' selected' : ''}>${esc(g.name)} (${g.n})</option>`).join('')}</select>
    ${none ? `<span class="small muted">${none} game${none > 1 ? 's' : ''} without battlefields recorded ${none > 1 ? 'aren’t' : 'isn’t'} counted.</span>` : ''}</div>`;
  const body = rowsK.length || colsK.length ? `<div class="scroll"><table class="bfm">
      <thead><tr><th>Mine ↓ · theirs →</th>${colsK.map(b => `<th>${esc(b)}</th>`).join('')}<th class="tot">All of theirs</th></tr></thead>
      <tbody>${rowsK.map(a => `<tr><td>${esc(a)}</td>${colsK.map(b => cell(cells.get(a + '\n' + b))).join('')}${cell(mine.get(a), 'tot')}</tr>`).join('')}
        <tr class="tot"><td>All of mine</td>${colsK.map(b => cell(theirs.get(b))).join('')}${cell(sum, 'tot')}</tr></tbody>
    </table></div>
    <p class="small muted" style="margin:10px 0 0">Each cell is your game win rate with your battlefield (row) against theirs (column). Totals also count games where only one side’s battlefield was recorded.</p>`
    : `<div class="empty"><h3>No battlefields recorded${sel ? ' for this matchup' : ''}</h3><p>In the match log, pick your battlefield and theirs for each game to see which ones win here.</p></div>`;
  return `<section class="panel" id="bf-panel"><div class="panel-head"><h2>Battlefields</h2><span class="small muted">Your battlefield against theirs, game by game</span></div>${picker}${body}</section>`;
}

    const a = recOf(keyOfGuide(g));
    // My battlefield for each game of a best of 3, from the deck's battlefields (plus any planned before the deck changed).

    const bfHTML = opts.length ? `<div class="bfo">${order.map((n, i) => `<div class="bfo-slot"><label class="label" for="g-bf${i}">Game ${i + 1}</label>

    editor = `

          ${S.ui.confirm === 'guide-del' ? `<span class="confirm">Remove this matchup and its notes? <button class="btn sm danger" data-act="sb-del">Remove</button><button class="btn sm" data-act="unconfirm">Keep</button></span>` : '<button class="btn sm" data-act="confirm" data-what="guide-del">Remove</button>'}</div>
      </div>
      <div style="display:grid;gap:18px">

function cheatSheet(d) {
  const gs = (d.guides || []).filter(g => hasSwaps(g) || hasSwaps(turnSecond(g)) || g.plan || g.play || g.draw || g.watch || bfOrder(g).some(Boolean));
  if (!gs.length) return '';
  const lines = [`${d.name || 'Deck'} · sideboard guide`, ''];
  const swaps = (s, tag) => {
    if ((s.ins || []).length) lines.push(`  ${tag}IN   ` + s.ins.map(x => `+${x.q} ${x.n}`).join(', '));
    if ((s.outs || []).length) lines.push(`  ${tag}OUT  ` + s.outs.map(x => `-${x.q} ${x.n}`).join(', '));
  };
  gs.map(g => ({ g, name: guideName(g) })).sort((a, b) => a.name.localeCompare(b.name)).forEach(({ g, name }) => {
    lines.push(`vs ${name}`);
    if (turnSecond(g)) { swaps(g, '1st '); swaps(g.second, '2nd '); } else swaps(g, '');
    const bf = bfOrder(g).map((n, i) => n ? `G${i + 1} ${n}` : '').filter(Boolean);
    if (bf.length) lines.push('  BF   ' + bf.join(' · '));
    if (g.plan) lines.push('  Plan: ' + g.plan.replace(/\s*\n\s*/g, ' / '));
    if (g.watch) lines.push('  Watch: ' + g.watch.replace(/\s*\n\s*/g, ' / '));
    if (g.play) lines.push('  1st: ' + g.play.replace(/\s*\n\s*/g, ' / '));
    if (g.draw) lines.push('  2nd: ' + g.draw.replace(/\s*\n\s*/g, ' / '));
    lines.push('');
  });
  return lines.join('\n').trim();
}
// Import from Matchups: opponents from this deck's match log, one per Legend or per Legend and Chosen Champion.

    <p class="small muted" style="margin:0 0 12px">Opponents from your match log with ${esc(d.name || 'this deck')}. Untick any you don't want in your sideboard list.</p>

    ${body}

}

function deckStatsHTML(d, v) {

// Units, spells and gear as a donut: one ring, a surface gap between slices, the total in the middle and a legend with counts.
function typePieHTML(types) {

  const tot = parts.reduce((a, p) => a + p.n, 0);
  if (!tot) return '<p class="small muted" style="margin:0">No units, spells or gear yet.</p>';
  // r = 15.9155 makes the ring 100 units around, so a slice's length is its percentage.
  const shown = parts.filter(p => p.n), gap = shown.length > 1 ? 0.7 : 0;
  let at = 0;
  const segs = shown.map(p => {
    const len = p.n / tot * 100, dash = Math.max(0.01, len - gap);
    const seg = `<circle class="pie-seg" r="15.9155" cx="21" cy="21" fill="none" stroke="var(--series-${p.s})" stroke-width="7" stroke-dasharray="${dash.toFixed(2)} ${(100 - dash).toFixed(2)}" stroke-dashoffset="${(-at).toFixed(2)}"><title>${p.label}: ${p.n} (${Math.round(len)}%)</title></circle>`;
    at += len; return seg;

    <svg class="pie" viewBox="0 0 42 42" role="img" aria-label="${parts.map(p => `${p.label} ${p.n}`).join(', ')} of ${tot} cards"><g transform="rotate(-90 21 21)">${segs}</g>
      <text x="21" y="21.5" font-size="8" font-weight="600">${tot}</text><text x="21" y="27" font-size="3.6" style="fill:var(--muted)">cards</text></svg>
    <ul class="pie-key">${parts.map(p => `<li><i style="background:var(--series-${p.s})"></i><span>${p.label}</span><span class="num">${p.n}</span><span class="num muted">${Math.round(p.n / tot * 100)}%</span></li>`).join('')}</ul>
  </div>`;
}

// --- One-page deck picture: every card in the list with its count, like a deck image to share.
// Legend, runes and battlefields on top; then the Chosen Champion and the main deck (units, spells, gear, each by energy); then the sideboard.
function deckSheet(d) {
  const card = (n, q) => ({ n, q, c: findCard(n) });
  const rank = c => !c ? 3 : c.t === 'Unit' ? 0 : c.t === 'Spell' ? 1 : c.t === 'Gear' ? 2 : 3;
  const order = (a, b) => rank(a.c) - rank(b.c) || ((a.c || {}).e ?? 99) - ((b.c || {}).e ?? 99) || a.n.localeCompare(b.n);
  return {
    top: [...(d.legend ? [card(d.legend, 1)] : []), ...parseList(d.runes).map(x => card(x.n, x.q)), ...parseList(d.bf).map(x => card(x.n, x.q))],
    main: [...(d.champion ? [card(d.champion, 1)] : []), ...parseList(d.main).map(x => card(x.n, x.q)).sort(order)],
    side: parseList(d.side).map(x => card(x.n, x.q)).sort(order),

}

}

      if (b.title) { text(b.title, PAD, y + 34, `700 30px ${font}`); y += SUB; }
      b.list.forEach((x, j) => drawCard(x, PAD + (j % COLS) * (W + GX), y + Math.floor(j / COLS) * (H + GY)));
      y += gridH(b.list);
    });
    const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
    if (!blob) throw new Error('png');
    await offerFile(`${fileSafe(d.name) || 'Deck'}.png`, blob);
  } catch { toast('Couldn’t make the image here. Take a screenshot of this page instead.'); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = 'Save as image (.png)'; } }
}

// --- Cards
function cardMatches() {
  const f = S.ui.cf, q = norm(f.q), d = curDeck(), L = f.fits ? legendOf(d) : null;
  let list = CDB.cards.filter(c =>
    (!f.types.length || f.types.some(t => t === 'Champion' ? isChampUnit(c) : c.t === t)) && (!f.sets.length || c.s.some(x => f.sets.includes(x))) &&
    (!f.doms.length || c.d.some(x => f.doms.includes(x))) &&
    (!f.costs.length || (c.e != null && f.costs.includes(String(Math.min(7, c.e))))) &&
    (!L || fitsLegend(c, L)) &&
    (!q || c.k.includes(q) || norm(c.x).includes(q) || (c.g || []).some(t => norm(t).includes(q))));
  if (f.sort === 'cost') list = list.slice().sort((a, b) => (a.e ?? 99) - (b.e ?? 99) || a.n.localeCompare(b.n));
  else list = list.slice().sort((a, b) => a.n.localeCompare(b.n));
  return list;
}
function copiesOf(d, n) { return qtyIn(d.main, n) + qtyIn(d.side, n) + (cardKey(d.champion) === cardKey(n) ? 1 : 0); }
function deckCounts(d) {
  const m = new Map(); if (!d) return m;
  const add = (n, k, q) => { const c = findCard(n); if (!c) return; const e = m.get(c.k) || { d: 0, s: 0 }; e[k] += q; m.set(c.k, e); };
  [d.main, d.runes, d.bf].forEach(t => parseList(t).forEach(c => add(c.n, 'd', c.q)));
  parseList(d.side).forEach(c => add(c.n, 's', c.q));
  if (d.champion) add(d.champion, 'd', 1);
  if (d.legend) add(d.legend, 'd', 1);
  return m;
}
function badgeHTML(e) { return e && (e.d || e.s) ? `${e.d ? `<span class="bq">${e.d}</span>` : ''}${e.s ? `<span class="bq sb">SB ${e.s}</span>` : ''}` : ''; }
function setChampion(d, c) { if (qtyIn(d.main, c.n)) d.main = bumpList(d.main, c.n, -1); d.champion = c.n; }

// Click-to-add: routes a card to the right part of the deck. Limits are never enforced here; going over is
// reported in the toast and the deck shows as Illegal until it's fixed.
function addCard(c, to) {
  const d = curDeck(); if (!d) { toast('Create a deck first.'); return null; }
  const R = rules(); let msg, over = '';
  if (c.t === 'Legend') { d.legend = c.n; d.domains = c.d.slice(); msg = `${c.n} set as Legend`; }
  else if (c.t === 'Rune') {
    d.runes = bumpList(d.runes, c.n, 1); msg = `+1 ${c.n}`;
    const n = total(parseList(d.runes)); if (n > R.runes) over = `${n}/${R.runes} runes`;
  } else if (c.t === 'Battlefield') {
    d.bf = bumpList(d.bf, c.n, 1); msg = `${c.n} added to battlefields`;
    const n = total(parseList(d.bf));
    if (qtyIn(d.bf, c.n) > 1) over = 'same battlefield twice'; else if (n > R.battlefields) over = `${n}/${R.battlefields} battlefields`;
  } else {
    const L = legendOf(d), tag = legendTag(L);
    if (to !== 'side' && isChampUnit(c) && !d.champion && (!tag || (c.g || []).includes(tag))) { setChampion(d, c); msg = `${c.n} set as Chosen Champion`; }
    else if (to === 'side') {
      d.side = bumpList(d.side, c.n, 1); msg = `+1 ${c.n} to sideboard`;
      const n = total(parseList(d.side)); if (n > R.sideMax) over = `sideboard ${n}/${R.sideMax}`;
    } else {
      d.main = bumpList(d.main, c.n, 1); msg = `+1 ${c.n}`;
      const n = total(parseList(d.main)); if (n > R.mainSize) over = `main deck ${n}/${R.mainSize}`;
    }
    const cp = copiesOf(d, c.n); if (cp > R.maxCopies) over = [over, `${cp} copies, limit ${R.maxCopies}`].filter(Boolean).join(', ');
  }
  if (isBanned(c.n)) over = [over, `banned in ${formatName()}`].filter(Boolean).join(', ');
  d.updated = Date.now(); persist('decks', d.id, 400);
  return over ? `${msg} · over the limit: ${over}` : msg;
}
// Row controls in the deck list and the card modal.
function rowOp(op, sec, n) {
  const d = curDeck(); if (!d) return;
  const R = rules(), sideFull = () => total(parseList(d.side)) > R.sideMax;
  if (op === 'inc') {
    d[sec] = bumpList(d[sec], n, 1);
    if ((sec === 'main' || sec === 'side') && copiesOf(d, n) > R.maxCopies) toast(`${copiesOf(d, n)} copies of ${n} · over the limit of ${R.maxCopies}`);
    else if (sec === 'side' && sideFull()) toast(`Sideboard ${total(parseList(d.side))}/${R.sideMax} · over the limit`);
    else if (sec === 'runes' && total(parseList(d.runes)) > R.runes) toast(`${total(parseList(d.runes))}/${R.runes} runes · over the limit`);
  } else if (op === 'dec') d[sec] = bumpList(d[sec], n, -1);
  else if (op === 'toSide') { d.main = bumpList(d.main, n, -1); d.side = bumpList(d.side, n, 1); if (sideFull()) toast(`Sideboard ${total(parseList(d.side))}/${R.sideMax} · over the limit`); }
  else if (op === 'toMain') { d.side = bumpList(d.side, n, -1); d.main = bumpList(d.main, n, 1); }
  else if (op === 'unlegend') d.legend = '';
  else if (op === 'unchamp') d.champion = '';
  d.updated = Date.now(); persist('decks', d.id, 400);
  refreshBuild();
}
// Saves now (instead of waiting for the autosave pause) and opens the legality verdict.

}
function reportHTML(d) {

async function importBackup(j) {
  // Bring screenshots along: same ids in the browser store, new ids when uploading to Claude storage.
  const idMap = {};
  if (j.files && assets) {
    for (const [id, url] of Object.entries(j.files)) {
      try {
        const blob = await (await fetch(url)).blob();
        if (assets.local) { await assets.put(id, blob); idMap[id] = id; }
        else { const r = await assets.upload(blob, { type: blob.type }); idMap[id] = r.id; }
      } catch {}
    }
  }
  Object.values(j.decks || {}).forEach(x => { if (x && x.id) { migrateDeck(x); S.decks[x.id] = x; persist('decks', x.id); } });
  Object.values(j.matches || {}).forEach(x => {
    if (!x || !x.id) return;
    x.shots = (x.shots || []).filter(sh => !j.files || idMap[sh.id]).map(sh => ({ ...sh, id: idMap[sh.id] || sh.id }));
    S.matches[x.id] = x; persist('matches', x.id);
  });
  if (j.settings) { S.settings = { ...S.settings, ...j.settings, id: 'main' }; persist('settings', 'main'); }
  const nf = Object.keys(idMap).length;
  ensureDeck(); toast(`Imported ${Object.keys(j.decks || {}).length} decks and ${Object.keys(j.matches || {}).length} matches${nf ? ` with ${nf} screenshot${nf > 1 ? 's' : ''}` : ''}`); render();
}
async function offerFile(filename, data, fallbackMsg) {
  if (downloads) {
    try { await downloads.save({ filename, data }); toast('Saved ' + filename); return; }
    catch (e) { if (e && e.code === 'declined') return; if (e && e.code === 'rate_limited') { toast('A save prompt is already open.'); return; } }
  }
  if (!window.claude) {
    const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], { type: /\.csv$/.test(filename) ? 'text/csv' : 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); toast('Saved ' + filename); return;
  }
  // A spreadsheet can't go on the clipboard like text can.
  if (typeof data !== 'string') { toast('Saving files isn’t available here.'); return; }
  copyText(data, fallbackMsg);
}

  const st = (o = {}) => {
    const font = idx(fonts, `<font>${o.b ? '<b/>' : ''}${o.i ? '<i/>' : ''}<sz val="${o.sz || 11}"/>${o.color ? `<color rgb="FF${o.color}"/>` : ''}<name val="Aptos Narrow"/><family val="2"/></font>`);
    const fill = o.fill ? idx(fills, `<fill><patternFill patternType="solid"><fgColor rgb="FF${o.fill}"/><bgColor indexed="64"/></patternFill></fill>`) : 0;

    const al = o.h || o.v || o.wrap ? `<alignment${o.h ? ` horizontal="${o.h}"` : ''}${o.v ? ` vertical="${o.v}"` : ''}${o.wrap ? ' wrapText="1"' : ''}/>` : '';

    cloudAuth(kind, document.getElementById('cl-user').value, document.getElementById('cl-pass').value);
    return;
  }
  if (f.id === 'match-form') saveForm();
  else if (f.id === 'quick-add') {
    const d = curDeck(), inp = document.getElementById('qa-name'), c = findCard(inp.value); if (!d) return;
    if (!c) { toast(inp.value.trim() ? 'No card with that name. Pick one from the suggestions.' : 'Type a card name first.'); return; }
    const msg = addCard(c, e.submitter && e.submitter.dataset.sec === 'side' ? 'side' : 'main'); if (!msg) return;
    inp.value = ''; toast(msg); render();
    setTimeout(() => document.getElementById('qa-name')?.focus(), 0);
  }
  else if (f.id === 'field-add') {
    const a = document.getElementById('fn-arch').value.trim(), s = document.getElementById('fn-share').value; if (!a) return;
    (S.settings.field = S.settings.field || []).push({ arch: legendName(a), share: s === '' ? 0 : Math.max(0, +s) }); persist('settings', 'main'); render();
    setTimeout(() => document.getElementById('fn-arch')?.focus(), 0);
  }
});
// ---------- install as an app ----------
// Chrome, Edge and Samsung Internet hand us an install prompt (beforeinstallprompt). iPhone/iPad and other
// browsers install from their own menus, so for those the button explains where to tap.
const INSTALL_KEY = 'riftprep.installLater';
const inst = { evt: null, ios: false, mobile: false, done: false };
function installInit() {
  if (window.claude) return;
  const ua = navigator.userAgent;
  inst.ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  inst.mobile = inst.ios || /Android|Mobi/i.test(ua);
  inst.done = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); inst.evt = e; render(); });
  addEventListener('appinstalled', () => { inst.evt = null; inst.done = true; toast('Installed. Open Riftcheese from your home screen.'); render(); });
}
const canInstall = () => !window.claude && !inst.done && !!(inst.evt || inst.mobile);
function installBannerHTML() {
  if (!canInstall() || !inst.mobile || S.ui.tab === 'data' || lsGet(INSTALL_KEY)) return '';
  return `<div class="banner install"><span>Install Riftcheese on your phone: it opens full screen like an app, even offline.</span><span class="row"><button class="btn sm primary" data-act="install">Install</button><button class="btn sm" data-act="install-later">Not now</button></span></div>`;
}
function installPanelHTML() {
  if (!canInstall()) return '';
  return `<section class="panel">
    <div class="panel-head"><h2>Install the app</h2></div>
    <p style="margin:0 0 12px;max-width:65ch">Add Riftcheese to your home screen to open it full screen like an app. It keeps working without a connection; card images you’ve already seen stay available offline. Your data is the same as here.</p>
    <button class="btn primary" data-act="install">Install Riftcheese</button>
  </section>`;
}
async function installApp() {
  const e = inst.evt;
  if (!e) { installHelp(); return; }
  inst.evt = null; // a prompt can only be shown once
  try { e.prompt(); const { outcome } = await e.userChoice; if (outcome !== 'accepted') render(); } catch { installHelp(); }
}
function installHelp() {
  const steps = inst.ios
    ? ['Tap the <strong>Share</strong> button (the square with an arrow). In Safari it can be under the <strong>•••</strong> button.', 'Scroll down and tap <strong>Add to Home Screen</strong>.', 'Turn on <strong>Open as Web App</strong> if you see it, then tap <strong>Add</strong>.']
    : ['Open your browser’s menu (<strong>⋮</strong> or <strong>☰</strong>).', 'Tap <strong>Install app</strong> or <strong>Add to Home screen</strong> (in Samsung Internet: <strong>Add page to → Home screen</strong>).', 'Confirm with <strong>Install</strong> or <strong>Add</strong>.'];
  S.ui.cardKey = null;
  document.getElementById('modal-body').innerHTML = `<h2 id="modal-title" style="font-size:18px;margin:0 0 12px">Install Riftcheese</h2>
    <ol style="margin:0;padding-left:20px;display:grid;gap:8px;max-width:48ch">${steps.map(s => `<li>${s}</li>`).join('')}</ol>
    <p class="small muted" style="margin:14px 0 0">Riftcheese then appears on your home screen like any other app.</p>`;
  const m = document.getElementById('modal'); m.hidden = false; m.querySelector('.modal-x').focus();
}
// ---------- footer + ads ----------
function renderFoot() {
  document.getElementById('foot').innerHTML = `<span>Unofficial fan tool, not affiliated with Riot Games.</span>${window.claude ? '' : '<a href="privacy.html">Privacy</a><a href="https://github.com/AtiaBabaBa/riftcheese" target="_blank" rel="noopener">Source</a>'}`;
}
function adsInit() {
  const { client, slot } = ADS_CONFIG, box = document.getElementById('ad');
  if (window.claude || !/^ca-pub-\d+$/.test(client)) return;
  const hide = () => { box.hidden = true; };
  let lib = document.querySelector('script[src*="adsbygoogle.js"]');
  if (!lib) { lib = document.createElement('script'); lib.async = true; lib.crossOrigin = 'anonymous'; lib.src = `https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=${client}`; document.head.appendChild(lib); }
  lib.addEventListener('error', hide); // blocked by an ad blocker: no empty box
  if (!/^\d+$/.test(slot)) return;
  box.innerHTML = `<span class="ad-label">Advertisement</span><ins class="adsbygoogle" style="display:block" data-ad-client="${client}" data-ad-slot="${slot}" data-ad-format="auto" data-full-width-responsive="true"></ins>`;
  box.hidden = false;
  // AdSense marks a slot it couldn't fill; hide it rather than leave a blank panel.
  new MutationObserver(() => { if (box.querySelector('ins[data-ad-status="unfilled"]')) hide(); }).observe(box, { attributes: true, subtree: true, attributeFilter: ['data-ad-status'] });
  try { (window.adsbygoogle = window.adsbygoogle || []).push({}); } catch { hide(); }
  setTimeout(() => { const ins = box.querySelector('ins'); if (ins && !ins.dataset.adStatus && !ins.querySelector('iframe')) hide(); }, 5000);
}
renderFoot();
adsInit();
installInit();
boot();
})();
</script>
