<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Riftbound Prep Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one working column under a sticky header + tab bar; views are tool panels, tables scroll in their own frames. */
:root {
  --bg: #ECEFF3; --panel: #FFFFFF; --panel-2: #F5F7FA; --ink: #1A2130; --muted: #5B6577; --line: #D6DCE5;
  --accent: #0E6D77; --accent-ink: #FFFFFF; --accent-soft: #DCEFF0; --gold: #946511;
  --win: #1D7A4C; --win-bg: #DCF0E4; --loss: #B0362E; --loss-bg: #F6DFDB; --draw: #7A6522; --draw-bg: #F2EBD2;
  --warn: #9A5B00; --warn-bg: #FBEBD0;
  --fury: #D2453A; --calm: #3B9855; --mind: #3874C6; --body: #DE872B; --chaos: #8C4DC2; --order: #C29C1E;
  --f-display: "Cinzel", "Trajan Pro", Georgia, serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10131A; --panel: #171B24; --panel-2: #1D222D; --ink: #E5E9F0; --muted: #98A1B2; --line: #2A3140;
  --accent: #46C3C7; --accent-ink: #08191B; --accent-soft: #163338; --gold: #D9A84C;
  --win: #54C98B; --win-bg: #15302A; --loss: #F07C70; --loss-bg: #3A1D1B; --draw: #D8C26C; --draw-bg: #332D17;
  --warn: #F0B35A; --warn-bg: #3A2A12; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #10131A; --panel: #171B24; --panel-2: #1D222D; --ink: #E5E9F0; --muted: #98A1B2; --line: #2A3140;
  --accent: #46C3C7; --accent-ink: #08191B; --accent-soft: #163338; --gold: #D9A84C;
  --win: #54C98B; --win-bg: #15302A; --loss: #F07C70; --loss-bg: #3A1D1B; --draw: #D8C26C; --draw-bg: #332D17;
  --warn: #F0B35A; --warn-bg: #3A2A12; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 16px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 12px 8px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.brand svg { flex: none; }
.brand h1 { font-family: var(--f-display); font-size: 20px; letter-spacing: .04em; font-weight: 700; }
.status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.ok { background: var(--win); } .dot.local { background: var(--warn); }
.deckpick { display: flex; align-items: center; gap: 8px; }
.deckpick select { max-width: 240px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; padding: 8px 14px 10px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

main { padding-block: 20px 64px; display: grid; gap: 20px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.panel h2 { font-size: 17px; font-weight: 700; }
.section-title { font-family: var(--f-display); font-size: 22px; font-weight: 700; letter-spacing: .02em; }

/* controls */
input[type=text], input[type=date], input[type=number], input[type=search], input[type=url], input[type=password], input:not([type]), select, textarea {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; width: 100%; min-width: 0;
}
textarea { resize: vertical; line-height: 1.5; }
textarea.list { font-family: var(--f-mono); font-size: 13px; min-height: 150px; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.field { display: grid; gap: 4px; min-width: 0; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 7px 14px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--loss); }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.btn.link { border: 0; background: none; padding: 2px 4px; color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 6px 12px; cursor: pointer; font-weight: 600; min-width: 38px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"].W { background: var(--win); color: var(--panel); }
.seg button[aria-pressed="true"].L { background: var(--loss); color: var(--panel); }
.seg button[aria-pressed="true"].D { background: var(--draw); color: var(--panel); }
.seg button[aria-pressed="true"].N { background: var(--accent); color: var(--accent-ink); }

/* pills + chips */
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12.5px; font-weight: 700; font-family: var(--f-mono); white-space: nowrap; }
.pill.W { background: var(--win-bg); color: var(--win); }
.pill.L { background: var(--loss-bg); color: var(--loss); }
.pill.D { background: var(--draw-bg); color: var(--draw); }
.pill.N { background: var(--panel-2); color: var(--muted); }
.pill.warn { background: var(--warn-bg); color: var(--warn); font-family: var(--f-body); }
.pill.bad { background: var(--loss-bg); color: var(--loss); font-family: var(--f-body); }
.pill.ok { background: var(--win-bg); color: var(--win); font-family: var(--f-body); }
.g { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 4px; font-size: 12px; font-weight: 700; font-family: var(--f-mono); position: relative; }
.g.W { background: var(--win-bg); color: var(--win); } .g.L { background: var(--loss-bg); color: var(--loss); } .g.D { background: var(--draw-bg); color: var(--draw); }
.turn { display: inline-flex; align-items: center; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 1px 6px; border-radius: 3px; white-space: nowrap; }
.turn.first { background: var(--accent); color: var(--accent-ink); }
.turn.second { background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
.dom { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; }
.dom i { width: 9px; height: 9px; border-radius: 2px; transform: rotate(45deg); display: inline-block; }
.dom-toggle { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.dom-toggle[aria-pressed="true"] { border-color: var(--ink); background: var(--panel-2); }

/* tables */
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
.bar { position: relative; height: 8px; width: 110px; background: var(--panel-2); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
.bar b { position: absolute; inset: 0 auto 0 0; background: var(--muted); }
.bar b.hi { background: var(--win); } .bar b.lo { background: var(--loss); }
.bar::after { content: ""; position: absolute; left: 50%; top: -1px; bottom: -1px; width: 1px; background: var(--ink); opacity: .45; }
.wr { display: flex; align-items: center; gap: 8px; }
.wr .num { min-width: 42px; text-align: right; }

/* stat tiles */
.tiles { display: grid; gap: 1px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.tile { background: var(--panel); padding: 12px 14px; display: grid; gap: 2px; }
.tile .v { font-family: var(--f-mono); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .s { font-size: 12px; color: var(--muted); }

/* log */
.log-layout { display: grid; gap: 20px; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; }
.log-single { max-width: 900px; width: 100%; }
.hist-sum { margin: 0 0 6px; }
.evrow { display: grid; gap: 12px; grid-template-columns: minmax(0, 2fr) minmax(64px, .7fr) minmax(150px, 1.3fr); }
.games { display: grid; gap: 8px; }
.game { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); }
.game { display: grid; gap: 10px; }
.game .gl { font-weight: 700; width: 58px; }
.game-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.game-grid { display: grid; gap: 10px; grid-template-columns: 120px minmax(0, 1fr) minmax(0, 1fr); }
.score { display: flex; align-items: center; gap: 4px; }
.score input { width: 52px; text-align: center; padding-inline: 4px; font-family: var(--f-mono); }
.sbline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.fsb { display: grid; gap: 10px; padding: 10px; border: 1px dashed var(--line); border-radius: 6px; background: var(--panel); }
.replays { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.replay { display: flex; align-items: center; gap: 8px; min-width: 0; }
.replay .rk { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 4px; flex: none; }
.replay .rn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .details { grid-column: 2 / -1; display: grid; gap: 4px; font-size: 13px; }
.mrow .details.row { display: flex; }
.gd { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.gd .g { width: 18px; height: 18px; font-size: 11px; }
.gd .sep { color: var(--muted); }
.pic { border: 0; background: none; padding: 0; cursor: pointer; line-height: 0; border-radius: 6px; flex: none; }
.pic:hover .cimg, .pic:focus-visible .cimg { box-shadow: 0 0 0 2px var(--accent); }
.pic.pic-empty { cursor: default; display: inline-block; }
.pic.pic-empty .cimg { display: block; background: var(--bg); border: 1.5px dashed var(--line); border-radius: 6px; }
.pic.bfpic { margin-top: 6px; justify-self: start; }
.lineup { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); }
.lu { display: grid; gap: 6px; justify-items: start; min-width: 0; }
.lu-pics { display: flex; gap: 6px; }
.lu-pics .pic { width: 64px; }
.lu-names { display: grid; gap: 4px; width: 100%; min-width: 0; }
.lu-names span { overflow-wrap: anywhere; }
.lineup > .lu-vs { align-self: center; }
.lu-vs { font-family: var(--f-display); font-weight: 700; color: var(--muted); font-size: 15px; }
.mlineup { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.mlineup .lu-vs { font-size: 12px; margin-inline: 4px; }
.bfs { display: inline-flex; align-items: center; gap: 5px; }
.bfs .pic.bfpic { margin-top: 0; }
.swap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.swcol { min-width: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.swhead { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; border-bottom: 1px solid var(--line); }
.swlist { max-height: 340px; overflow: auto; padding: 4px; display: grid; }
.swrow { display: grid; grid-template-columns: 20px 26px minmax(0, 1fr) auto 28px; gap: 7px; align-items: center; padding: 3px 4px; border-radius: 4px; }
.swrow.side { grid-template-columns: 28px 20px 26px minmax(0, 1fr) auto; }
.swrow .cn { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.swrow .cimg.mini { width: 26px; }
.swq { text-align: right; font-weight: 600; font-size: 13px; }
.swrow.moved.in { background: var(--win-bg); }
.swrow.moved.out { background: var(--loss-bg); }
.swrow.chosen .chosen-tag { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--gold); border: 1px solid var(--gold); border-radius: 4px; padding: 0 4px; }
.swtag { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 0 5px; white-space: nowrap; }
.swtag.in { color: var(--win); border: 1px solid var(--win); }
.swtag.out { color: var(--loss); border: 1px solid var(--loss); }
.sbbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 1px 9px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.sbbtn:hover, .sbbtn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
.sbview { display: grid; gap: 6px; margin: 2px 0 6px 26px; padding: 8px 10px; border-left: 2px solid var(--accent); background: var(--panel-2); border-radius: 0 6px 6px 0; }
.sbview > div { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.sbitem { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.shots { display: flex; flex-wrap: wrap; gap: 8px; }
.shot { position: relative; }
.shot-img { border: 1px solid var(--line); background: var(--panel-2); padding: 0; border-radius: 6px; overflow: hidden; cursor: zoom-in; line-height: 0; display: block; }
.shot-img img { height: 84px; width: auto; max-width: 160px; object-fit: cover; display: block; }
.shot-img:hover { border-color: var(--accent); }
.small-shots .shot-img img { height: 56px; max-width: 110px; }
.mrow .details.shots { display: flex; }
.shot.missing .shot-img, .shot-img.missing { opacity: .35; }
.shot-x { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--loss); color: #fff; font-weight: 700; cursor: pointer; line-height: 1; }
.shot-full { display: block; max-width: 100%; max-height: calc(100vh - 120px); margin: 28px auto 0; border-radius: 6px; }
.replay-video { width: 100%; max-height: 360px; border-radius: 6px; background: #000; }
.preview { font-size: 14px; }
.mrow { display: grid; grid-template-columns: 88px minmax(0, 1fr) auto auto; gap: 10px 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.mrow:last-child { border-bottom: 0; }
.mrow .opp { font-weight: 600; overflow-wrap: anywhere; }
.mrow .meta { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.mrow .note { grid-column: 2 / -1; font-size: 13px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.mrow .gs { display: flex; gap: 3px; }

/* sideboard */
.sb-layout { display: grid; gap: 20px; grid-template-columns: 250px minmax(0, 1fr); align-items: start; }
.mlist { display: grid; gap: 2px; }
.mitem { display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; width: 100%; border: 1px solid transparent; background: none; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.mitem:hover { background: var(--panel-2); }
.mitem[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent); }
.mitem .nm { font-weight: 600; overflow-wrap: anywhere; }
.st { width: 8px; height: 8px; border-radius: 50%; flex: none; border: 1.5px solid var(--muted); }
.st.done { background: var(--win); border-color: var(--win); }
.st.bad { background: var(--warn); border-color: var(--warn); }
.inout { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.clist { display: grid; }
.crow { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.crow:last-child { border-bottom: 0; }
.crow .cn { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.crow .have { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.crow.on .cn { font-weight: 700; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.stepper button { border: 0; background: var(--panel-2); width: 28px; height: 28px; cursor: pointer; font-weight: 700; }
.stepper button:disabled { opacity: .35; cursor: default; }
.stepper span { width: 28px; text-align: center; font-family: var(--f-mono); font-weight: 600; }
.crow.on.in .stepper span { color: var(--win); } .crow.on.out .stepper span { color: var(--loss); }
.balance { padding: 10px 12px; border-radius: 6px; font-weight: 600; }
.balance.ok { background: var(--win-bg); color: var(--win); }
.balance.bad { background: var(--warn-bg); color: var(--warn); }
.balance.none { background: var(--panel-2); color: var(--muted); }
.cheat { font-family: var(--f-mono); font-size: 13px; white-space: pre-wrap; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; overflow-wrap: anywhere; max-height: 420px; overflow: auto; }

/* decks */
.decks { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.dcard { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 14px; cursor: pointer; display: grid; gap: 6px; align-content: start; }
.dcard:hover { border-color: var(--muted); }
.dcard[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.dcard .dn { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
.dcard.new { place-items: center; align-content: center; color: var(--muted); border: 1.5px dashed var(--muted); min-height: 110px; font-weight: 600; background: none; }
.dcard.new:hover { color: var(--accent); border-color: var(--accent); }
.dcard.has-art { grid-template-columns: 52px minmax(0, 1fr); column-gap: 12px; }
.dcard.has-art > :not(.dart) { grid-column: 2; }
.dcard .dart { grid-column: 1; grid-row: 1 / span 4; width: 52px; }
.sections { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.issues { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.issues li { display: flex; gap: 8px; align-items: baseline; font-size: 14px; }

.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--r); background: var(--warn-bg); color: var(--warn); font-weight: 600; font-size: 14px; }
.empty { text-align: center; padding: 36px 16px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.empty h3 { color: var(--ink); font-size: 17px; }
.confirm { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 6px; font-weight: 600; font-size: 14px; z-index: 50; max-width: calc(100% - 32px); }
.copybox { display: grid; gap: 8px; margin-top: 10px; }
.copybox textarea { font-family: var(--f-mono); font-size: 12.5px; min-height: 160px; }

/* cards */
.cimg { display: inline-block; flex: none; border-radius: 6px; background-color: var(--panel-2); background-repeat: no-repeat; max-width: 100%; }

// One copy across: main→side ('out') undoes a brought-in copy first, otherwise records a take-out; side→main mirrors it.
function swapMove(ins, outs, n, dir) {
  ins = ins.map(x => ({ ...x })); outs = outs.map(x => ({ ...x }));
  const dec = arr => { const it = arr.find(x => cardKey(x.n) === cardKey(n) && x.q > 0); if (!it) return false; it.q--; return true; };
  const inc = arr => { let it = arr.find(x => cardKey(x.n) === cardKey(n)); if (!it) { it = { n, q: 0 }; arr.push(it); } it.q++; };
  if (dir === 'out') { if (!dec(ins)) inc(outs); } else { if (!dec(outs)) inc(ins); }
  return [ins.filter(x => x.q > 0), outs.filter(x => x.q > 0)];
}

function bfTableHTML(list) {
  const by = new Map();
  list.forEach(m => (m.games || []).forEach(g => {
    if (!g.myBf || (g.r !== 'W' && g.r !== 'L')) return;
    const e = by.get(g.myBf) || { W: 0, L: 0 }; e[g.r]++; by.set(g.myBf, e);
  }));
  if (!by.size) return '';
  const rows = [...by.entries()].sort((a, b) => (b[1].W + b[1].L) - (a[1].W + a[1].L)).map(([n, a]) => `<tr><td><strong>${esc(n)}</strong></td><td class="num">${a.W}–${a.L}</td><td>${wrCell(pct(a))}</td></tr>`).join('');
  return `<section class="panel"><div class="panel-head"><h2>By my battlefield</h2><span class="small muted">Game win rate on each battlefield you picked</span></div>
    <div class="scroll"><table><thead><tr><th>Battlefield</th><th>Games</th><th>Game win</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

function cheatSheet(d) {
  const gs = (d.guides || []).filter(g => (g.ins || []).length || (g.outs || []).length || g.plan || g.play || g.draw || g.watch);
  if (!gs.length) return '';
  const lines = [`${d.name || 'Deck'} · sideboard guide`, ''];
  gs.sort((a, b) => a.arch.localeCompare(b.arch)).forEach(g => {
    lines.push(`vs ${g.arch}`);
    if ((g.ins || []).length) lines.push('  IN   ' + g.ins.map(x => `+${x.q} ${x.n}`).join(', '));
    if ((g.outs || []).length) lines.push('  OUT  ' + g.outs.map(x => `-${x.q} ${x.n}`).join(', '));
    if (g.plan) lines.push('  Plan: ' + g.plan.replace(/\s*\n\s*/g, ' / '));
    if (g.watch) lines.push('  Watch: ' + g.watch.replace(/\s*\n\s*/g, ' / '));
    if (g.play) lines.push('  1st: ' + g.play.replace(/\s*\n\s*/g, ' / '));
    if (g.draw) lines.push('  2nd: ' + g.draw.replace(/\s*\n\s*/g, ' / '));
    lines.push('');
  });
  return lines.join('\n').trim();
}

function deckStatsHTML(d, v) {

// --- Cards
function cardMatches() {
  const f = S.ui.cf, q = norm(f.q), d = curDeck(), L = f.fits ? legendOf(d) : null;
  let list = CDB.cards.filter(c =>
    (!f.types.length || f.types.some(t => t === 'Champion' ? isChampUnit(c) : c.t === t)) && (!f.sets.length || c.s.some(x => f.sets.includes(x))) &&
    (!f.doms.length || c.d.some(x => f.doms.includes(x))) &&
    (!f.costs.length || (c.e != null && f.costs.includes(String(Math.min(7, c.e))))) &&
    (!L || fitsLegend(c, L)) &&
    (!q || c.k.includes(q) || norm(c.x).includes(q) || (c.g || []).some(t => norm(t).includes(q))));
  if (f.sort === 'cost') list = list.slice().sort((a, b) => (a.e ?? 99) - (b.e ?? 99) || a.n.localeCompare(b.n));
  else list = list.slice().sort((a, b) => a.n.localeCompare(b.n));
  return list;
}
function copiesOf(d, n) { return qtyIn(d.main, n) + qtyIn(d.side, n) + (cardKey(d.champion) === cardKey(n) ? 1 : 0); }
function deckCounts(d) {
  const m = new Map(); if (!d) return m;
  const add = (n, k, q) => { const c = findCard(n); if (!c) return; const e = m.get(c.k) || { d: 0, s: 0 }; e[k] += q; m.set(c.k, e); };
  [d.main, d.runes, d.bf].forEach(t => parseList(t).forEach(c => add(c.n, 'd', c.q)));
  parseList(d.side).forEach(c => add(c.n, 's', c.q));
  if (d.champion) add(d.champion, 'd', 1);
  if (d.legend) add(d.legend, 'd', 1);
  return m;
}
function badgeHTML(e) { return e && (e.d || e.s) ? `${e.d ? `<span class="bq">${e.d}</span>` : ''}${e.s ? `<span class="bq sb">SB ${e.s}</span>` : ''}` : ''; }
function setChampion(d, c) { if (qtyIn(d.main, c.n)) d.main = bumpList(d.main, c.n, -1); d.champion = c.n; }

// Click-to-add: routes a card to the right part of the deck. Limits are never enforced here; going over is
// reported in the toast and the deck shows as Illegal until it's fixed.
function addCard(c, to) {
  const d = curDeck(); if (!d) { toast('Create a deck first.'); return null; }
  const R = rules(); let msg, over = '';
  if (c.t === 'Legend') { d.legend = c.n; d.domains = c.d.slice(); msg = `${c.n} set as Legend`; }
  else if (c.t === 'Rune') {
    d.runes = bumpList(d.runes, c.n, 1); msg = `+1 ${c.n}`;
    const n = total(parseList(d.runes)); if (n > R.runes) over = `${n}/${R.runes} runes`;
  } else if (c.t === 'Battlefield') {
    d.bf = bumpList(d.bf, c.n, 1); msg = `${c.n} added to battlefields`;
    const n = total(parseList(d.bf));
    if (qtyIn(d.bf, c.n) > 1) over = 'same battlefield twice'; else if (n > R.battlefields) over = `${n}/${R.battlefields} battlefields`;
  } else {
    const L = legendOf(d), tag = L && (L.g || [])[0];
    if (to !== 'side' && isChampUnit(c) && !d.champion && (!tag || (c.g || []).includes(tag))) { setChampion(d, c); msg = `${c.n} set as Chosen Champion`; }
    else if (to === 'side') {
      d.side = bumpList(d.side, c.n, 1); msg = `+1 ${c.n} to sideboard`;
      const n = total(parseList(d.side)); if (n > R.sideMax) over = `sideboard ${n}/${R.sideMax}`;
    } else { d.main = bumpList(d.main, c.n, 1); msg = `+1 ${c.n}`; }
    const cp = copiesOf(d, c.n); if (cp > R.maxCopies) over = [over, `${cp} copies, limit ${R.maxCopies}`].filter(Boolean).join(', ');
  }
  if (isBanned(c.n)) over = [over, `banned in ${formatName()}`].filter(Boolean).join(', ');
  d.updated = Date.now(); persist('decks', d.id, 400);
  return over ? `${msg} · over the limit: ${over}` : msg;
}
// Row controls in the deck list and the card modal.
function rowOp(op, sec, n) {
  const d = curDeck(); if (!d) return;
  const R = rules(), sideFull = () => total(parseList(d.side)) > R.sideMax;
  if (op === 'inc') {
    d[sec] = bumpList(d[sec], n, 1);
    if ((sec === 'main' || sec === 'side') && copiesOf(d, n) > R.maxCopies) toast(`${copiesOf(d, n)} copies of ${n} · over the limit of ${R.maxCopies}`);
    else if (sec === 'side' && sideFull()) toast(`Sideboard ${total(parseList(d.side))}/${R.sideMax} · over the limit`);
    else if (sec === 'runes' && total(parseList(d.runes)) > R.runes) toast(`${total(parseList(d.runes))}/${R.runes} runes · over the limit`);
  } else if (op === 'dec') d[sec] = bumpList(d[sec], n, -1);
  else if (op === 'toSide') { d.main = bumpList(d.main, n, -1); d.side = bumpList(d.side, n, 1); if (sideFull()) toast(`Sideboard ${total(parseList(d.side))}/${R.sideMax} · over the limit`); }
  else if (op === 'toMain') { d.side = bumpList(d.side, n, -1); d.main = bumpList(d.main, n, 1); }
  else if (op === 'unlegend') d.legend = '';
  else if (op === 'unchamp') d.champion = '';

}

      ${[['minMain', 'Main deck minimum'], ['maxCopies', 'Max copies per card'], ['runes', 'Runes'], ['battlefields', 'Battlefields'], ['sideMax', 'Sideboard maximum'], ['winPoints', 'Points to win a game']].map(([k, n]) => `<div class="field"><label class="label" for="r-${k}">${n}</label><input id="r-${k}" type="number" min="0" value="${R[k]}" data-bind="rules" data-k="${k}"></div>`).join('')}

}

// ---------- actions ----------
function setTab(t) { S.ui.tab = t; S.ui.confirm = null; S.ui.copy = null; saveUI(); render(); window.scrollTo(0, 0); }
function newDeck(base) {
  const id = uid('d');
  S.decks[id] = base ? { ...clone(base), id, name: (base.name || 'Deck') + ' (copy)', example: false, created: Date.now() }
    : { id, name: 'New deck', legend: '', champion: '', champSep: true, domains: [], main: '', side: '', runes: '', bf: '', notes: '', guides: [], created: Date.now() };
  delete S.decks[id].example;
  S.ui.deckId = id; saveUI(); persist('decks', id); S.ui.tab = 'decks';
  if (S.form && !S.form.editId) S.form.deckId = id;
  render();
  setTimeout(() => { const e = document.getElementById('d-name'); if (e) { e.focus(); e.select(); } }, 0);
}
async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); toast(okMsg); S.ui.copy = null; }
  catch { S.ui.copy = text; render(); setTimeout(() => { const t = document.getElementById('copy-fallback'); if (t) { t.focus(); t.select(); } }, 0); }
}
async function exportBackup() {
  const data = { app: 'riftbound-prep', version: 2, exported: new Date().toISOString(), decks: S.decks, matches: S.matches, settings: S.settings };
  // Screenshots stored in this browser go into the backup so they move with the matches.
  if (mode === 'local') {
    const ids = [...new Set(Object.values(S.matches).flatMap(m => (m.shots || []).map(x => x.id)))].filter(isStoredHere);
    if (ids.length) toast(`Packing ${ids.length} screenshot${ids.length > 1 ? 's' : ''}…`);
    data.files = {};
    for (const id of ids) { const b = await getStored(id).catch(() => null); if (b) data.files[id] = await blobToDataURL(b); }
  }
  offerFile(`riftbound-prep-${today()}.json`, JSON.stringify(data, null, 2), 'Backup copied to clipboard');
}
async function importBackup(j) {
  // Bring screenshots along: same ids in the browser store, new ids when uploading to Claude storage.
  const idMap = {};
  if (j.files && assets) {
    for (const [id, url] of Object.entries(j.files)) {
      try {
        const blob = await (await fetch(url)).blob();
        if (assets.local) { await assets.put(id, blob); idMap[id] = id; }
        else { const r = await assets.upload(blob, { type: blob.type }); idMap[id] = r.id; }
      } catch {}
    }
  }
  Object.values(j.decks || {}).forEach(x => { if (x && x.id) { migrateDeck(x); S.decks[x.id] = x; persist('decks', x.id); } });
  Object.values(j.matches || {}).forEach(x => {
    if (!x || !x.id) return;
    x.shots = (x.shots || []).filter(sh => !j.files || idMap[sh.id]).map(sh => ({ ...sh, id: idMap[sh.id] || sh.id }));
    S.matches[x.id] = x; persist('matches', x.id);
  });
  if (j.settings) { S.settings = { ...S.settings, ...j.settings, id: 'main' }; persist('settings', 'main'); }
  const nf = Object.keys(idMap).length;
  ensureDeck(); toast(`Imported ${Object.keys(j.decks || {}).length} decks and ${Object.keys(j.matches || {}).length} matches${nf ? ` with ${nf} screenshot${nf > 1 ? 's' : ''}` : ''}`); render();
}
async function offerFile(filename, data, fallbackMsg) {
  if (downloads) {
    try { await downloads.save({ filename, data }); toast('Saved ' + filename); return; }
    catch (e) { if (e && e.code === 'declined') return; if (e && e.code === 'rate_limited') { toast('A save prompt is already open.'); return; } }
  }
  if (!window.claude) {
    const url = URL.createObjectURL(new Blob([data], { type: /\.csv$/.test(filename) ? 'text/csv' : 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); toast('Saved ' + filename); return;
  }
  copyText(data, fallbackMsg);
}
function deleteAsset(id) {
  if (!assets || !id) return;
  assets.delete(id).catch(() => {});
}
async function uploadShots(files) {
  const st = document.getElementById('shot-status'), say = t => { if (st) st.textContent = t; };
  if (!assets) { toast('Uploading needs edit access to this page.'); return; }
  const ok = /^image\/(png|jpeg|webp|gif)$/;
  let done = 0;
  for (const file of files) {
    if (!ok.test(file.type)) { toast(`${file.name || 'That file'} isn’t a PNG, JPG, WebP or GIF image.`); continue; }
    if (file.size > 20 * 1048576) { toast(`${file.name} is over 20 MB.`); continue; }
    say(`Uploading ${file.name || 'screenshot'}…`);
    try {
      const img = await shrinkImage(file);
      const r = await assets.upload(img, { type: img.type });
      S.form.shots.push({ id: r.id, name: img.name || `Screenshot ${S.form.shots.length + 1}`, size: r.sizeBytes, type: r.contentType }); done++;
    } catch (e) {
      const c = e && e.code;
      say(c === 'quota_or_state' ? 'Storage for this page is full. Remove old screenshots first.' : c === 'rate_limited' ? 'Too many uploads at once. Wait a moment and try again.' : 'Upload failed. Try again.');
      break;
    }
  }
  if (done) { toast(`${done} screenshot${done > 1 ? 's' : ''} added. Save the match to keep ${done > 1 ? 'them' : 'it'}.`); render(); }
}
function openShot(id) {
  S.ui.cardKey = null;
  document.getElementById('modal-body').innerHTML = `<img class="shot-full" ${assetAttr(id)} alt="Screenshot">`;
  const m = document.getElementById('modal'); m.hidden = false; m.querySelector('.modal-x').focus();
}
async function uploadReplay(file) {
  const st = document.getElementById('rp-status');
  const say = t => { if (st) st.textContent = t; };
  if (!assets) { toast('Uploading needs edit access to this page.'); return; }
  if (file.size > 20 * 1048576) { toast(`${file.name} is ${(file.size / 1048576).toFixed(1)} MB. The limit is 20 MB; trim the video or paste a link instead.`); return; }
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  const type = file.type && !/;/.test(file.type) && file.type !== 'application/octet-stream' ? file.type
    : ({ mp4: 'video/mp4', webm: 'video/webm', json: 'application/json', txt: 'text/plain', pdf: 'application/pdf', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', webp: 'image/webp', gif: 'image/gif' })[ext];
  if (!type) { toast('That file type can’t be stored. Use mp4 or webm video, an image, PDF or JSON.'); return; }
  say(`Uploading ${file.name}…`);
  try {
    const r = await assets.upload(file, { type });
    S.form.replays.push({ kind: 'file', id: r.id, name: file.name, size: r.sizeBytes, type: r.contentType });
    toast('Replay uploaded. Save the match to keep it.'); render();
  } catch (e) {
    const c = e && e.code;
    say(c === 'too_large' ? 'Too large: the limit is 20 MB.' : c === 'unsupported_type' ? 'That file type isn’t supported.' : c === 'quota_or_state' ? 'Storage for this page is full. Remove old replays first.' : c === 'rate_limited' ? 'Too many uploads at once. Wait a moment and try again.' : 'Upload failed. Try again, or paste a link instead.');
  }
}
function csvCell(v) { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }

function saveForm() {
  const f = S.form;
  if (!f.deckId || !S.decks[f.deckId]) { toast('Pick your deck first.'); return; }
  if (!f.opp.trim()) { toast('Enter the opponent’s deck.'); document.getElementById('f-opp')?.focus(); return; }
  f.games.forEach(autoResult);
  if (!f.games.some(g => g.r)) { toast('Mark at least one game result, or type a score.'); return; }
  const id = f.editId || uid('m');
  const prev = S.matches[id];
  S.matches[id] = { id, deckId: f.deckId, opp: f.opp.trim(), oppName: f.oppName.trim(), event: f.event.trim(), round: f.round.trim(), date: f.date || today(),
    games: f.games.map(g => ({ r: g.r, first: g.first, ms: g.ms === '' ? '' : +g.ms, os: g.os === '' ? '' : +g.os, myBf: g.myBf, oppBf: g.oppBf.trim(), ins: g.ins.filter(x => x.q > 0), outs: g.outs.filter(x => x.q > 0) })),
    replays: f.replays.map(x => ({ ...x })), shots: f.shots.map(x => ({ ...x })), oppLegend: f.oppLegend.trim(), oppChamp: f.oppChamp.trim(),
    myLegend: f.editId && f.myLegend != null ? f.myLegend : (S.decks[f.deckId]?.legend || ''), myChamp: f.editId && f.myChamp != null ? f.myChamp : (S.decks[f.deckId]?.champion || ''),
    notes: f.notes.trim(), created: prev?.created || Date.now(), ...(prev?.example ? { example: true } : {}) };
  // Uploaded files removed while editing are deleted from storage once the change is saved.
  (prev?.replays || []).filter(x => x.kind === 'file' && !f.replays.some(y => y.id === x.id)).forEach(x => deleteAsset(x.id));
  (prev?.shots || []).filter(x => !f.shots.some(y => y.id === x.id)).forEach(x => deleteAsset(x.id));
  persist('matches', id);
  toast(f.editId ? 'Match updated · see the History tab' : 'Match saved · see the History tab');
  S.form = blankForm(f.editId ? null : f);
  if (f.editId) S.form.deckId = f.deckId;
  S.ui.sbOpen = null;
  render();
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (b.id === 'modal' && e.target !== b) return;
  const act = b.dataset.act, d = curDeck();
  switch (act) {
    case 'tab': setTab(b.dataset.tab); break;
    case 'confirm': S.ui.confirm = b.dataset.what; render(); break;
    case 'unconfirm': S.ui.confirm = null; render(); break;
    case 'close-copy': S.ui.copy = null; render(); break;
    case 'g-res': { const g = S.form.games[+b.dataset.i]; g.r = g.r === b.dataset.v ? '' : b.dataset.v; render(); break; }
    case 'g-first': { const g = S.form.games[+b.dataset.i]; g.first = g.first === b.dataset.v ? '' : b.dataset.v; render(); break; }
    case 'cancel-edit': S.form = blankForm(); S.ui.sbOpen = null; render(); break;
    case 'fsb-toggle': {
      const i = +b.dataset.i, g = S.form.games[i], deck = S.decks[S.form.deckId];
      S.ui.sbOpen = S.ui.sbOpen === i ? null : i;
      // First time open with nothing recorded: start from the guide for this opponent.
      const guide = deck && S.form.opp.trim() && getGuide(deck, norm(S.form.opp));
      if (S.ui.sbOpen === i && i > 0 && !g.ins.length && !g.outs.length && guide && ((guide.ins || []).length || (guide.outs || []).length)) {
        g.ins = (guide.ins || []).map(x => ({ ...x })); g.outs = (guide.outs || []).map(x => ({ ...x })); toast(`Filled from your guide vs ${guide.arch}`);
      }
      render(); break; }
    case 'swap': {
      const n = b.dataset.card, dir = b.dataset.dir;
      if (b.dataset.ctx === 'game') { const g = S.form.games[+b.dataset.i]; [g.ins, g.outs] = swapMove(g.ins, g.outs, n, dir); render(); }
      else if (d) { const key = S.ui.guideKey, g = getGuide(d, key, archNames().get(key) || key, true); [g.ins, g.outs] = swapMove(g.ins || [], g.outs || [], n, dir); persist('decks', d.id, 400); render(); }
      break; }
    case 'sb-view': { const k = b.dataset.id + ':' + b.dataset.i; S.ui.sbView = S.ui.sbView === k ? null : k; render(); break; }
    case 'fsb-step': {
      const g = S.form.games[+b.dataset.i], k = b.dataset.side === 'in' ? 'ins' : 'outs', n = b.dataset.card;
      let it = g[k].find(x => norm(x.n) === norm(n)); if (!it) { it = { n, q: 0 }; g[k].push(it); }
      it.q = Math.max(0, it.q + +b.dataset.d); g[k] = g[k].filter(x => x.q > 0); render(); break; }
    case 'fsb-guide': { const g = S.form.games[+b.dataset.i], guide = getGuide(S.decks[S.form.deckId], norm(S.form.opp)); if (!guide) break;
      g.ins = (guide.ins || []).map(x => ({ ...x })); g.outs = (guide.outs || []).map(x => ({ ...x })); render(); break; }
    case 'fsb-copy': { const i = +b.dataset.i, g = S.form.games[i], prev = S.form.games[i - 1]; g.ins = prev.ins.map(x => ({ ...x })); g.outs = prev.outs.map(x => ({ ...x })); render(); break; }
    case 'fsb-clear': { const g = S.form.games[+b.dataset.i]; g.ins = []; g.outs = []; render(); break; }
    case 'rp-add': {
      const inp = document.getElementById('rp-url'), v = inp.value.trim();
      if (!/^https?:\/\/\S+$/i.test(v)) { toast('Paste a full link starting with https://'); inp.focus(); break; }
      let label = 'Replay link'; try { label = new URL(v).hostname.replace(/^www\./, ''); } catch {}
      S.form.replays.push({ kind: 'link', url: v, label }); render(); break; }
    case 'shot-del': S.form.shots.splice(+b.dataset.j, 1); render(); break;
    case 'shot-view': openShot(b.dataset.id); break;
    case 'rp-del': S.form.replays.splice(+b.dataset.j, 1); render(); break;
    case 'rp-watch': { const k = b.dataset.id + ':' + b.dataset.j; S.ui.watch = S.ui.watch === k ? null : k; render(); break; }
    case 'edit-match': { const m = S.matches[b.dataset.id]; if (!m) break;
      S.form = { editId: m.id, deckId: m.deckId, opp: m.opp || '', oppName: m.oppName || '', event: m.event || '', round: m.round || '', date: m.date || today(),
        games: [0, 1, 2].map(i => gameFromSaved(m.games?.[i])), notes: m.notes || '', replays: (m.replays || []).map(x => ({ ...x })), shots: (m.shots || []).map(x => ({ ...x })),
        oppLegend: m.oppLegend || '', oppChamp: m.oppChamp || '', myLegend: m.myLegend ?? null, myChamp: m.myChamp ?? null };
      S.ui.sbOpen = null;
      S.ui.confirm = null; S.ui.tab = 'log'; saveUI(); render(); window.scrollTo(0, 0); break; }
    case 'del-match': (S.matches[b.dataset.id]?.replays || []).filter(x => x.kind === 'file').forEach(x => deleteAsset(x.id)); (S.matches[b.dataset.id]?.shots || []).forEach(x => deleteAsset(x.id)); removeDoc('matches', b.dataset.id); S.ui.confirm = null; if (S.form.editId === b.dataset.id) S.form = blankForm(); toast('Match deleted'); render(); break;
    case 'log-filter': S.ui.logFilter = b.dataset.v; saveUI(); render(); break;
    case 'stats-scope': S.ui.statsScope = b.dataset.v; saveUI(); render(); break;
    case 'open-guide': { S.ui.guideKey = b.dataset.key; setTab('sideboard'); break; }
    case 'pick-guide': S.ui.guideKey = b.dataset.key; S.ui.copy = null; render(); break;
    case 'g-step': {
      if (!d) break; const key = S.ui.guideKey, arch = archNames().get(key) || key;
      const g = getGuide(d, key, arch, true), arrK = b.dataset.side === 'in' ? 'ins' : 'outs', arr = g[arrK] = g[arrK] || [];
      const n = b.dataset.card, delta = +b.dataset.d;
      let it = arr.find(x => norm(x.n) === norm(n)); if (!it) { it = { n, q: 0 }; arr.push(it); }
      it.q = Math.max(0, it.q + delta); g[arrK] = arr.filter(x => x.q > 0);
      persist('decks', d.id, 400); render(); break; }
    case 'g-prune': { if (!d) break; const g = getGuide(d, S.ui.guideKey); if (!g) break;
      const side = parseList(d.side), main = parseList(d.main);
      g.ins = (g.ins || []).filter(x => side.some(c => norm(c.n) === norm(x.n))); g.outs = (g.outs || []).filter(x => main.some(c => norm(c.n) === norm(x.n)));
      persist('decks', d.id); render(); break; }
    case 'copy-sheet': if (d) { const t = cheatSheet(d); if (t) copyText(t, 'Cheat sheet copied'); else toast('Write a guide first.'); } break;
    case 'new-deck': newDeck(); break;
    case 'dup-deck': if (d) { newDeck(d); toast('Deck duplicated'); } break;
    case 'pick-deck': S.ui.deckId = b.dataset.id; S.ui.confirm = null; S.ui.pasteOpen = false; S.ui.copy = null; saveUI(); S.form.editId || (S.form.deckId = b.dataset.id); render(); break;
    case 'del-deck': if (d) { removeDoc('decks', d.id); S.ui.confirm = null; S.ui.deckId = null; ensureDeck(); saveUI(); toast('Deck deleted'); render(); } break;
    case 'dom': if (d) { const set = new Set(d.domains || []); set.has(b.dataset.v) ? set.delete(b.dataset.v) : set.add(b.dataset.v); d.domains = DOMAINS.filter(x => set.has(x)); persist('decks', d.id); render(); } break;
    case 'paste-open': S.ui.pasteOpen = true; S.ui.drawer = false; setTab('decks'); setTimeout(() => document.getElementById('paste-box')?.focus(), 0); break;
    case 'paste-toggle': S.ui.pasteOpen = !S.ui.pasteOpen; render(); break;
    case 'paste-apply': if (d) { const t = document.getElementById('paste-box').value; if (!t.trim()) { toast('Paste a list first.'); break; }
      const p = parseExport(t);
      if (!p.legend && !p.champion && !p.main && !p.side && !p.runes && !p.bf) { toast('No cards found. Use lines like "3 Card Name" or the one-line "Legend: 1 … MainDeck: 3 …" format.'); break; }
      Object.assign(d, { main: p.main, side: p.side, runes: p.runes, bf: p.bf }); if (p.legend) d.legend = p.legend; if (p.champion) d.champion = p.champion;
      const L = legendOf(d); if (L) d.domains = L.d.slice();
      if (L && (!d.name || /^new deck/i.test(d.name))) d.name = `${(L.g || [])[0] || L.n} deck`;
      const all = [p.legend, p.champion, ...[p.main, p.side, p.runes, p.bf].flatMap(x => parseList(x).map(c => c.n))].filter(Boolean);
      const unknown = CDB.ok ? all.filter(n => !findCard(n)) : [];
      const v = deckIssues(d);
      S.ui.pasteOpen = false; persist('decks', d.id); render();
      toast(`Imported: main deck ${v.mt}, sideboard ${v.st}, runes ${v.rt}, battlefields ${v.bt}${unknown.length ? ` · ${unknown.length} name${unknown.length > 1 ? 's' : ''} not found: ${unknown.slice(0, 3).join(', ')}` : ''}`); } break;
    case 'copy-deck': if (d) copyText(deckText(d), 'Deck list copied'); break;
    case 'field-del': { const f = S.settings.field || []; f.splice(+b.dataset.i, 1); persist('settings', 'main'); render(); break; }
    case 'field-add-seen': { (S.settings.field = S.settings.field || []).push({ arch: b.dataset.arch, share: 0 }); persist('settings', 'main'); render(); break; }
    case 'rules-reset': S.settings.rules = { ...RULES_DEFAULT }; persist('settings', 'main'); render(); break;
    case 'export-json': exportBackup(); break;
    case 'export-csv': {
      const gcols = i => [`g${i}`, `g${i}_first`, `g${i}_my_points`, `g${i}_opp_points`, `g${i}_my_battlefield`, `g${i}_opp_battlefield`, `g${i}_sided_in`, `g${i}_sided_out`];
      const head = ['date', 'event', 'round', 'my_deck', 'my_legend', 'my_champion', 'opponent_deck', 'opponent', 'opp_legend', 'opp_champion', 'result', 'games_won', 'games_lost', ...gcols(1), ...gcols(2), ...gcols(3), 'replays', 'notes'];
      const gv = g => [g.r, g.first, g.ms, g.os, g.myBf, g.oppBf, (g.ins || []).map(x => `${x.q} ${x.n}`).join('; '), (g.outs || []).map(x => `${x.q} ${x.n}`).join('; ')];
      const rows = sortedMatches().map(m => { const r = matchResult(m), g = i => m.games?.[i] || {};
        const me = myLineup(m, S.decks[m.deckId]);
        return [m.date, m.event, m.round, S.decks[m.deckId]?.name || '', me.L, me.C, m.opp, m.oppName, m.oppLegend || '', m.oppChamp || '', r.res, r.w, r.l, ...gv(g(0)), ...gv(g(1)), ...gv(g(2)),
          (m.replays || []).map(x => x.kind === 'link' ? x.url : x.name).join(' | '), m.notes].map(csvCell).join(','); });
      offerFile(`riftbound-matches-${today()}.csv`, [head.join(','), ...rows].join('\n'), 'CSV copied to clipboard'); break; }
    case 'card-add': { const c = CDB.byKey.get(b.dataset.k); if (!c) break; const msg = addCard(c, S.ui.addTo); if (msg) { toast(msg); if (c.t === 'Legend') { S.ui.cf.limit = 60; render(); } else refreshBuild(); } break; }
    case 'card-info': case 'card-open': openCard(b.dataset.k); break;
    case 'modal-close': closeCard(); break;
    case 'row': rowOp(b.dataset.op, b.dataset.sec, b.dataset.n); if (b.dataset.op === 'unlegend' && S.ui.tab === 'cards') render(); break;
    case 'add-to': S.ui.addTo = b.dataset.v; document.querySelectorAll('[data-act="add-to"]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.v === S.ui.addTo))); break;
    case 'cf-multi': { const f = S.ui.cf, k = b.dataset.k, v = b.dataset.v; f[k] = b.checked ? [...new Set([...f[k], v])] : f[k].filter(x => x !== v); syncFilters(); break; }
    case 'cf-multi-clear': S.ui.cf[b.dataset.k] = []; syncFilters(); break;
    case 'cf-untag': { const f = S.ui.cf, k = b.dataset.k; f[k] = f[k].filter(x => x !== b.dataset.v); syncFilters(); break; }
    case 'cf-clear-all': MULTI.forEach(m => { S.ui.cf[m.k] = []; }); syncFilters(); break;
    case 'cf-show': S.ui.cf.types = [b.dataset.type]; S.ui.cf.limit = 60; S.ui.drawer = false; render(); break;
    case 'drawer': S.ui.drawer = !S.ui.drawer; document.getElementById('deck-panel')?.classList.toggle('open', S.ui.drawer); break;
    case 'new-deck-here': newDeck(); setTab('cards'); break;
    case 'set-legend': { const c = CDB.byKey.get(S.ui.cardKey); if (!c || !d) break; d.legend = c.n; d.domains = c.d.slice(); persist('decks', d.id); toast(`${c.n} set as Legend`); if (S.ui.tab === 'cards') { const k = S.ui.cardKey; render(); openCard(k); } else refreshBuild(); break; }
    case 'set-champ': { const c = CDB.byKey.get(S.ui.cardKey); if (!c || !d) break; setChampion(d, c); persist('decks', d.id); toast(`${c.n} set as Chosen Champion`); refreshBuild(); break; }
    case 'cf-fits': S.ui.cf.fits = !S.ui.cf.fits; S.ui.cf.limit = 60; render(); break;
    case 'save-deck': saveDeck(); break;
    case 'report-close': S.ui.report = null; if (S.ui.tab === 'cards') refreshBuild(); else render(); break;
    case 'cloud-sync': cloudPull(false); toast('Syncing…'); break;
    case 'cloud-out': cloudSignOut(); break;
    case 'visual-toggle': S.ui.visual = !S.ui.visual; renderDeckCheck(); break;
    case 'clear-examples': {
      Object.values(S.decks).filter(x => x.example).forEach(x => removeDoc('decks', x.id));
      Object.values(S.matches).filter(x => x.example).forEach(x => removeDoc('matches', x.id));
      if (S.settings.example) { S.settings = { id: 'main', field: [], rules: { ...(S.settings.rules || RULES_DEFAULT) } }; persist('settings', 'main'); }
      S.ui.confirm = null; S.ui.deckId = null; ensureDeck(); S.form = blankForm(); saveUI(); toast('Example data cleared'); render(); break; }
  }
});

document.addEventListener('click', e => {
  document.querySelectorAll('details.ms[open]').forEach(dt => { if (!dt.contains(e.target)) dt.open = false; });
}, true);
document.addEventListener('toggle', e => {
  const dt = e.target; if (!dt.matches || !dt.matches('details.ms') || !dt.open) return;
  document.querySelectorAll('details.ms[open]').forEach(x => { if (x !== dt) x.open = false; });
}, true);
document.addEventListener('paste', e => {
  if (S.ui.tab !== 'log' || !assets) return;
  const imgs = [...(e.clipboardData?.files || [])].filter(f => /^image\//.test(f.type));
  if (!imgs.length) return;
  e.preventDefault(); uploadShots(imgs);
});
document.addEventListener('contextmenu', e => {
  const t = e.target.closest('.ccard[data-k]'); if (!t) return;
  e.preventDefault(); openCard(t.dataset.k);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !document.getElementById('modal').hidden) { closeCard(); return; }
  if (e.key === 'Escape') { const o = document.querySelector('details.ms[open]'); if (o) { o.open = false; o.querySelector('summary').focus(); return; } }
  const t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t.classList && t.classList.contains('ccard')) { e.preventDefault(); t.click(); }
  if (e.key === 'i' && t.classList && t.classList.contains('ccard')) { e.preventDefault(); openCard(t.dataset.k); }
});
document.addEventListener('input', e => {
  const el = e.target, bind = el.dataset && el.dataset.bind; if (!bind) return;
  const k = el.dataset.k, d = curDeck();
  if (bind === 'hist') { S.ui.hq = el.value; const h = document.getElementById('hist-list'); if (h) h.innerHTML = historyListHTML(); return; }
  if (bind === 'cf') {
    S.ui.cf[k] = el.value; S.ui.cf.limit = 60; renderResults();
  } else if (bind === 'game') {
    const g = S.form.games[+el.dataset.i]; g[k] = el.value;
    if ((k === 'ms' || k === 'os') && autoResult(g)) render();
  } else if (bind === 'form') {
    S.form[k] = el.value;
  } else if (bind === 'deck' && d) {
    d[k] = el.value; d.updated = Date.now(); persist('decks', d.id, 700);
    if (['main', 'side', 'runes', 'bf'].includes(k)) renderDeckCheck();
    if (k === 'name') { renderChrome(); }
  } else if (bind === 'guide' && d) {
    const g = getGuide(d, S.ui.guideKey, archNames().get(S.ui.guideKey), true); g[k] = el.value; persist('decks', d.id, 700);
  } else if (bind === 'field') {
    const f = S.settings.field[+el.dataset.i]; if (!f) return;
    f[k] = k === 'share' ? (el.value === '' ? '' : Math.max(0, +el.value)) : el.value; persist('settings', 'main', 600);
  } else if (bind === 'rules') {
    S.settings.rules = { ...rules(), [k]: k === 'format' ? el.value : Math.max(0, parseInt(el.value, 10) || 0) }; persist('settings', 'main', 600);
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'f-opp') { if (guessOpp(S.form) || S.ui.sbOpen != null) render(); return; }
  if (el.id === 'f-opplegend' || el.id === 'f-oppchamp') { render(); return; }
  if (el.dataset && el.dataset.bind === 'game' && (el.dataset.k === 'myBf' || el.dataset.k === 'oppBf')) { render(); return; }
  if (el.id === 'deck-pick') { S.ui.deckId = el.value; S.ui.confirm = null; S.ui.pasteOpen = false; S.ui.copy = null; if (!S.form.editId) S.form.deckId = el.value; saveUI(); render(); return; }
  if (el.id === 'f-deck') { S.form.deckId = el.value; S.ui.sbOpen = null; render(); return; }
  if (el.id === 'd-legend' || el.id === 'd-champion') {
    const d = curDeck(), L = legendOf(d);
    if (d && L && el.id === 'd-legend') { d.domains = L.d.slice(); persist('decks', d.id); }
    render(); return;
  }
  if (el.dataset && (el.dataset.bind === 'field' || el.dataset.bind === 'rules')) { render(); return; }
  if (el.id === 'shot-file' && el.files && el.files.length) { uploadShots([...el.files]); el.value = ''; return; }
  if (el.id === 'rp-file' && el.files && el.files[0]) { uploadReplay(el.files[0]); el.value = ''; return; }
  if (el.id === 'import-file' && el.files && el.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const j = JSON.parse(r.result); if (!j || typeof j !== 'object' || (!j.decks && !j.matches)) throw 0;
        importBackup(j);
      } catch { toast('That file isn’t a Riftbound Prep Book backup.'); }
    };
    r.readAsText(el.files[0]); el.value = '';
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'cloud-form') {
    const kind = e.submitter && e.submitter.dataset.mode === 'up' ? 'up' : 'in';
    cloudAuth(kind, document.getElementById('cl-user').value, document.getElementById('cl-pass').value);
    return;
  }
  if (f.id === 'match-form') saveForm();
  else if (f.id === 'quick-add') {
    const d = curDeck(), inp = document.getElementById('qa-name'), c = findCard(inp.value); if (!d) return;
    if (!c) { toast(inp.value.trim() ? 'No card with that name. Pick one from the suggestions.' : 'Type a card name first.'); return; }
    const msg = addCard(c, e.submitter && e.submitter.dataset.sec === 'side' ? 'side' : 'main'); if (!msg) return;
    inp.value = ''; toast(msg); render();
    setTimeout(() => document.getElementById('qa-name')?.focus(), 0);
  }
  else if (f.id === 'add-arch') {
    const v = document.getElementById('new-arch').value.trim(), d = curDeck(); if (!v || !d) return;
    const key = norm(v); getGuide(d, key, v, true); S.ui.guideKey = key; persist('decks', d.id); render();
  } else if (f.id === 'field-add') {
    const a = document.getElementById('fn-arch').value.trim(), s = document.getElementById('fn-share').value; if (!a) return;
    (S.settings.field = S.settings.field || []).push({ arch: a, share: s === '' ? 0 : Math.max(0, +s) }); persist('settings', 'main'); render();
    setTimeout(() => document.getElementById('fn-arch')?.focus(), 0);
  }
});
boot();
})();
</script>
